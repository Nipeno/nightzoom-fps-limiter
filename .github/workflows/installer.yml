name: Installer

# Installer CI: builds the Tauri GUI installer (NZ-Installer.exe) as a build artifact.
# Dev-only — runs just for installer changes. Releases (v* tags) are built by release.yml.
on:
  push:
    branches: [ main ]
    paths:
      - 'installer/**'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'installer/**'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'installer/src-tauri -> target'

      # generate_context!() embeds ui/ + the icon at compile time, so a plain
      # cargo build produces a self-contained portable exe (no bundling needed).
      - name: Build installer
        working-directory: installer/src-tauri
        run: cargo build --release

      - name: Stage exe
        run: Copy-Item installer/src-tauri/target/release/nz-installer.exe NZ-Installer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NZ-Installer
          path: NZ-Installer.exe
