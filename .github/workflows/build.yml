name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

permissions:
  contents: write      # needed to attach assets to a Release on tag

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      # --- Fetch the latest official ReShade (add-on build) -----------------
      # Scrape the version off reshade.me; fall back to a known-good pin so the
      # build never breaks if the site changes or rate-limits us.
      - name: Resolve + download latest ReShade
        run: |
          $fallback = '6.7.3'
          $ver = $fallback
          try {
            $html = (Invoke-WebRequest -Uri 'https://reshade.me/' -UseBasicParsing -UserAgent 'Mozilla/5.0').Content
            $m = [regex]::Match($html, 'ReShade_Setup_([0-9.]+)_Addon\.exe')
            if ($m.Success) { $ver = $m.Groups[1].Value }
          } catch {
            Write-Host "::warning::Could not scrape reshade.me ($($_.Exception.Message)); using pinned $fallback"
          }
          Write-Host "Using ReShade version: $ver"
          "reshade_version=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $url = "https://reshade.me/downloads/ReShade_Setup_${ver}_Addon.exe"
          Write-Host "Downloading $url"
          curl.exe -fL -A 'Mozilla/5.0' -o ReShade_Setup.exe $url

          # Extract just the 64-bit ReShade DLL from the installer.
          7z e ReShade_Setup.exe ReShade64.dll -y
          if (-not (Test-Path ReShade64.dll) -or ((Get-Item ReShade64.dll).Length -lt 100000)) {
            Write-Error "ReShade64.dll was not extracted correctly (download may have failed)."
            exit 1
          }
          Copy-Item ReShade64.dll dxgi.dll -Force   # FiveM loads ReShade as dxgi.dll

      # --- Assemble the drag-and-drop bundle --------------------------------
      - name: Assemble bundle
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path 'dist/Copy-these-into-plugins' | Out-Null
          # Files the user drags into their FiveM plugins folder.
          Copy-Item build/Release/NZ-FPS-Limiter.addon64 'dist/Copy-these-into-plugins/'
          Copy-Item dxgi.dll                             'dist/Copy-these-into-plugins/'
          Copy-Item packaging/Enable-ReShade.bat         'dist/Copy-these-into-plugins/'
          # Guide + licenses stay at the zip root.
          Copy-Item packaging/INSTALL.html           dist/
          Copy-Item third_party/ReShade-LICENSE.txt  dist/
          Copy-Item LICENSE                          dist/LICENSE.txt
          $zip = "NZ-FPS-Limiter_v$env:reshade_version.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force
          "bundle_zip=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # --- Artifact (available on every build) ------------------------------
      - name: Upload bundle (zip)
        uses: actions/upload-artifact@v4
        with:
          name: NZ-FPS-Limiter
          path: ${{ env.bundle_zip }}

      # --- Release (only when a v* tag is pushed) ---------------------------
      - name: Attach asset to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: NightZoom FPS Limiter ${{ github.ref_name }}
          body: |
            Locks your game to a smooth **60 FPS**. A ReShade add-on for the NightZoom server.

            **How to install:** download and extract the zip, then open the included
            **`INSTALL.html`** for the full step-by-step. The zip bundles ReShade, so it's
            all you need (already have ReShade? `INSTALL.html` says what to skip).

            💬 Discord: https://discord.gg/nightzoom · Open source (GPLv3).
          files: ${{ env.bundle_zip }}
