[package]
name = "nz-installer"
version = "0.1.0"
description = "NightZoom FPS Limiter installer"
authors = ["Nipeno"]
edition = "2021"

[lib]
name = "nz_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# blocking HTTP with rustls (no OpenSSL dependency on the Windows runner)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
